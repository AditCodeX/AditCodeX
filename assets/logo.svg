<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <!-- Galaxy Nebula Gradients -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00cfff"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="pulsar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00cfff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00cfff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00cfff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00cfff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="cosmic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Nebula Underglow -->
  <circle cx="24" cy="24" r="22" fill="url(#nebula-bg)"/>

  <!-- Tactical Hex Shield Outer Ring -->
  <polygon points="24,3 41,12 41,36 24,45 7,36 7,12" 
           fill="url(#shield-grad)" 
           stroke="#30363d" 
           stroke-width="1.2"/>

  <!-- Inner Cyan Hex Accent Border -->
  <polygon points="24,6 38,14 38,34 24,42 10,34 10,14" 
           fill="none" 
           stroke="url(#cyber-cyan)" 
           stroke-width="1" 
           stroke-opacity="0.4"/>

  <!-- Orbital Cosmic Ring (Tilted Planetary Orbit) -->
  <ellipse cx="24" cy="24" rx="16" ry="6.5" 
           transform="rotate(-28 24 24)" 
           fill="none" 
           stroke="url(#cyber-cyan)" 
           stroke-width="1.4" 
           stroke-dasharray="1 3 8 2"
           filter="url(#cosmic-glow)"/>

  <!-- Orbiting Satellite Star -->
  <circle cx="36" cy="17" r="1.5" fill="#ffffff" filter="url(#cosmic-glow)"/>
  <circle cx="12" cy="31" r="1.2" fill="#00cfff"/>

  <!-- Central Cyber 'X' Core (Precision Interlocking Blades) -->
  <!-- Top-Left to Bottom-Right -->
  <path d="M16 15 L21 21 L16 33 L19.5 33 L24 24 L28.5 33 L32 33 L27 21 L32 15 L28.5 15 L24 21.5 L19.5 15 Z" 
        fill="url(#cyber-cyan)" 
        filter="url(#cosmic-glow)"/>

  <!-- Pulsar Core (Glow + Starlight Diamond) -->
  <circle cx="24" cy="24" r="7" fill="url(#pulsar-glow)"/>
  <polygon points="24,20 26.5,24 24,28 21.5,24" fill="#ffffff"/>

  <!-- Tactical Corner Crosshairs -->
  <line x1="24" y1="1" x2="24" y2="4" stroke="#00cfff" stroke-width="1.5"/>
  <line x1="24" y1="44" x2="24" y2="47" stroke="#00cfff" stroke-width="1.5"/>
</svg>
